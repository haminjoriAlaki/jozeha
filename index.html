<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f5f7fb">
<title>خانه</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
  *,*::before,*::after{ box-sizing:border-box; }

  :root{
    --primary:#4f46e5;
    --primary-dark:#4338ca;
    --primary-soft:#eef1ff;
    --teal:#0ea5a4;
    --teal-soft:#dcf5f3;
    --text:#1d2233;
    --muted:#6b7280;
    --line:#e7eaf3;
    --shadow-sm:0 2px 8px rgba(23,32,79,.06);
    --shadow-md:0 12px 30px rgba(23,32,79,.08);
    --shadow-lg:0 24px 60px rgba(23,32,79,.12);
    --r-lg:28px;
    --r-md:18px;
    --r-sm:14px;
  }

  html{ -webkit-text-size-adjust:100%; }

  body{
    margin:0;
    min-height:100vh;
    padding:32px 16px 48px;
    font-family:"Vazirmatn", system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
    color:var(--text);
    line-height:1.85;
    background:
      radial-gradient(1100px 560px at 100% -10%, #e6ecff 0%, transparent 60%),
      radial-gradient(900px 520px at -10% 110%, #e2f7f4 0%, transparent 55%),
      #f5f7fb;
    background-attachment:fixed;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }

  .container{
    width:100%;
    max-width:980px;
    margin:0 auto;
  }

  /* ---------- هدر صفحه ---------- */
  .page-head{
    text-align:center;
    margin-bottom:30px;
    animation:fadeUp .6s ease both;
  }

  .eyebrow{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:6px 16px;
    border-radius:999px;
    background:#fff;
    border:1px solid var(--line);
    box-shadow:var(--shadow-sm);
    color:var(--primary);
    font-size:.8rem;
    font-weight:600;
  }

  .page-head h1{
    margin:16px 0 6px;
    font-size:clamp(1.6rem, 4.2vw, 2.3rem);
    font-weight:700;
    letter-spacing:-.5px;
  }

  .page-head p{
    margin:0;
    color:var(--muted);
    font-size:clamp(.88rem, 2.4vw, 1rem);
  }

  /* ---------- کارت کورس ---------- */
  .course{
    background:rgba(255,255,255,.78);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    border:1px solid rgba(255,255,255,.9);
    border-radius:var(--r-lg);
    box-shadow:var(--shadow-lg);
    padding:clamp(16px, 3vw, 30px);
    animation:fadeUp .7s .08s ease both;
  }

  .course-head{
    display:flex;
    align-items:center;
    gap:14px;
    padding-bottom:18px;
    margin-bottom:20px;
    border-bottom:1px dashed var(--line);
  }

  .course-icon{
    flex:0 0 auto;
    width:52px;
    height:52px;
    border-radius:16px;
    display:grid;
    place-items:center;
    font-size:1.45rem;
    background:linear-gradient(135deg, var(--primary), #7c6cf6);
    box-shadow:0 10px 22px rgba(79,70,229,.30);
  }

  .course-head h2{
    margin:0;
    font-size:clamp(1.05rem, 2.6vw, 1.3rem);
    font-weight:700;
  }

  .course-head .meta{
    display:block;
    font-size:.8rem;
    font-weight:400;
    color:var(--muted);
  }

  /* ---------- شبکه اساتید ---------- */
  .profs{
    display:grid;
    grid-template-columns:repeat(2, minmax(0, 1fr));
    gap:16px;
  }

  .prof{
    background:#fff;
    border:1px solid var(--line);
    border-radius:var(--r-md);
    padding:16px;
    box-shadow:var(--shadow-sm);
  }

  .prof-title{
    display:flex;
    align-items:center;
    gap:10px;
    margin:0 0 14px;
    font-size:1rem;
    font-weight:700;
  }

  .dot{
    width:10px;
    height:10px;
    border-radius:50%;
    background:var(--primary);
    box-shadow:0 0 0 4px var(--primary-soft);
  }

  .prof--alt .dot{
    background:var(--teal);
    box-shadow:0 0 0 4px var(--teal-soft);
  }

  /* ---------- لیست جزوه‌ها ---------- */
  .lessons{
    list-style:none;
    margin:0;
    padding:0;
    display:grid;
    gap:10px;
  }

  .lesson{
    display:flex;
    align-items:center;
    gap:12px;
    padding:11px 14px;
    border-radius:var(--r-sm);
    background:#fbfcff;
    border:1px solid var(--line);
    color:inherit;
    text-decoration:none;
    font-size:.95rem;
    font-weight:500;
    transition:transform .18s ease, box-shadow .18s ease,
               border-color .18s ease, background .18s ease;
  }

  .lesson:hover,
  .lesson:focus-visible{
    background:#fff;
    border-color:#c7cdfb;
    box-shadow:0 10px 22px rgba(79,70,229,.13);
    transform:translateX(-4px);
    outline:none;
  }

  .lesson:focus-visible{
    box-shadow:0 0 0 3px rgba(79,70,229,.25), 0 10px 22px rgba(79,70,229,.13);
  }

  .lesson .num{
    flex:0 0 auto;
    width:28px;
    height:28px;
    border-radius:9px;
    display:grid;
    place-items:center;
    font-size:.78rem;
    font-weight:700;
    color:var(--primary);
    background:var(--primary-soft);
  }

  .lesson .name{ flex:1 1 auto; }

  .lesson .chev{
    flex:0 0 auto;
    width:8px;
    height:8px;
    border-left:2px solid #b9c0d8;
    border-bottom:2px solid #b9c0d8;
    transform:rotate(45deg);
    transition:border-color .18s ease;
  }

  .lesson:hover .chev{ border-color:var(--primary); }

  /* ---------- حالت خالی ---------- */
  .empty{
    margin:0;
    padding:20px 14px;
    text-align:center;
    color:var(--muted);
    font-size:.88rem;
    background:#fbfcff;
    border:1.5px dashed #dfe3ef;
    border-radius:var(--r-sm);
  }

  .foot{
    margin-top:26px;
    text-align:center;
    font-size:.78rem;
    color:#9aa1b5;
  }

  /* ---------- انیمیشن ---------- */
  @keyframes fadeUp{
    from{ opacity:0; transform:translateY(14px); }
    to{ opacity:1; transform:none; }
  }

  /* ---------- ریسپانسیو ---------- */
  @media (max-width:720px){
    body{ padding:22px 12px 36px; }
    .profs{ grid-template-columns:1fr; }
    .course-icon{ width:46px; height:46px; font-size:1.25rem; }
  }

  @media (prefers-reduced-motion:reduce){
    *{ animation:none !important; transition:none !important; }
  }
</style>
</head>
<body>

<div class="container">

  <!-- هدر -->
  <header class="page-head">
    <span class="eyebrow">جزوه ها</span>
    <h1>خانه</h1>
    <p>تهیه شده توسط دانشجو های پزشکی دانشکده علوم پزشکی ساوه</p>
  </header>

  <!-- کارت کورس گوارش -->
  <section class="course" aria-labelledby="course-title">

    <div class="course-head">
      <div class="course-icon" aria-hidden="true">🩺</div>
      <div>
        <h2 id="course-title">کورس گوارش</h2>
        <span class="meta">۲ استاد · ۴ جزوه</span>
      </div>
    </div>

    <div class="profs">

      <!-- استاد بیگدلی -->
      <div class="prof">
        <h3 class="prof-title"><span class="dot" aria-hidden="true"></span> استاد بیگدلی</h3>

        <ul class="lessons">
          <li>
            <a class="lesson" href="1 2 - مری.html">
              <span class="num" aria-hidden="true">۱</span>
              <span class="name">مری</span>
              <span class="chev" aria-hidden="true"></span>
            </a>
          </li>
          <li>
            <a class="lesson" href="3 - معده.html">
              <span class="num" aria-hidden="true">۲</span>
              <span class="name">معده</span>
              <span class="chev" aria-hidden="true"></span>
            </a>
          </li>
          <li>
            <a class="lesson" href="4 - صفرا.html">
              <span class="num" aria-hidden="true">۳</span>
              <span class="name">صفرا</span>
              <span class="chev" aria-hidden="true"></span>
            </a>
          </li>
          <li>
            <a class="lesson" href="5 - سیروز.html">
              <span class="num" aria-hidden="true">۴</span>
              <span class="name">سیروز</span>
              <span class="chev" aria-hidden="true"></span>
            </a>
          </li>
        </ul>
      </div>

      <!-- استاد روحانی -->
      <div class="prof prof--alt">
        <h3 class="prof-title"><span class="dot" aria-hidden="true"></span> استاد روحانی</h3>
        <p class="empty">هنوز جزوه‌ای اضافه نشده است — به‌زودی</p>
      </div>

    </div>
  </section>

  <p class="foot">برای دسترسی به هر جزوه، روی عنوان آن کلیک کنید.</p>

</div>

</body>
</html>
